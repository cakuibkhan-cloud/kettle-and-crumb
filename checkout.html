<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Kettle & Crumb</title>
  <style>
    :root{--bg:#F2F0EA;--panel:#FFF;--ink:#22201D;--ink-soft:#5A564F;--plum:#4A2545;--plum-deep:#33192E;--gold:#E0A83E;--gold-deep:#C08F2E;--line:#DDD8CC}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',-apple-system,sans-serif;line-height:1.55}h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0 0 .4em;color:var(--plum-deep)}a{color:var(--plum)}.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
    nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.logo{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;color:var(--plum-deep)}.navlinks a{margin-left:24px;text-decoration:none;color:var(--ink);font-size:.95rem}.navlinks a:hover{color:var(--plum)}
    .checkout-panel{max-width:680px;margin:64px auto;padding:40px;background:var(--panel);border:1px solid var(--line);border-radius:4px}.checkout-panel p{color:var(--ink-soft)}.cart-items{margin:24px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden}.cart-item{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.cart-item:last-child{border-bottom:0}.cart-item img{width:80px;height:80px;object-fit:contain;background:var(--bg);border-radius:3px}.cart-item h3{font-size:1rem;margin:0}.cart-item p{margin:4px 0 0;font-size:.9rem}.cart-total{display:flex;justify-content:space-between;padding:18px 0;font-weight:600;font-size:1.1rem}.empty-cart{text-align:center;padding:24px;color:var(--ink-soft)}.btn{display:inline-block;padding:13px 26px;border-radius:2px;text-decoration:none;font-size:.95rem;cursor:pointer;border:none;font-family:'Work Sans',sans-serif}.btn-primary{background:var(--plum);color:#fff}.btn-primary:hover{background:var(--plum-deep)}.btn-outline{background:transparent;color:var(--plum);border:1.5px solid var(--plum)}.btn-outline:hover{background:var(--plum);color:#fff}.actions{display:flex;gap:12px;flex-wrap:wrap}.confirmation{display:none;margin-top:18px;padding:14px;background:#efe4c7;color:var(--plum-deep);border-radius:3px}footer{background:var(--plum-deep);color:#D8CFD6;padding:40px 24px;margin-top:60px}.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}@media(max-width:600px){.checkout-panel{padding:24px;margin-top:32px}.cart-item{grid-template-columns:64px 1fr}.cart-item img{width:64px;height:64px}.cart-item strong{grid-column:2}.navlinks a{margin-left:10px;font-size:.8rem}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PM9BRNDX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <nav><div class="logo">Kettle & Crumb</div><div class="navlinks"><a href="index.html">Home</a><a href="index.html#menu">Menu</a><a href="index.html#contact">Contact</a></div></nav>
  <main class="wrap"><div class="checkout-panel"><h1>Checkout</h1><p>Review your practice order below. No payment is processed and no personal information is stored.</p><div id="cart-items" class="cart-items"></div><div class="cart-total"><span>Total</span><span id="cart-total">Rs. 0</span></div><div class="actions"><a class="btn btn-outline" href="index.html#menu">← Continue shopping</a><button class="btn btn-primary" id="buy-now" type="button">Buy Now</button></div><div class="confirmation" id="confirmation">Order confirmed for practice purposes. No real purchase was made.</div></div></main>
  <footer><div class="wrap footer-inner"><div>© 2026 Kettle & Crumb — GTM practice site</div></div></footer>
  <script>
    window.dataLayer=window.dataLayer||[];
    var cart=JSON.parse(localStorage.getItem('kettleCart')||'[]');
    function renderCart(){
      var container=document.getElementById('cart-items'),total=0;
      if(!cart.length){container.innerHTML='<div class="empty-cart">Your cart is empty. Add an item from the menu first.</div>';document.getElementById('buy-now').disabled=true;return}
      container.innerHTML=cart.map(function(item){var line=item.price*item.quantity;total+=line;return '<div class="cart-item"><img src="'+item.image+'" alt="'+item.item_name+'"><div><h3>'+item.item_name+'</h3><p>Quantity: '+item.quantity+' · Rs. '+item.price+' each</p></div><strong>Rs. '+line+'</strong></div>'}).join('');
      document.getElementById('cart-total').textContent='Rs. '+total;
    }
    dataLayer.push({event:'checkout_view',ecommerce:{currency:'PKR',items:cart}});
    document.getElementById('buy-now').addEventListener('click',function(){
      if(!cart.length)return;
      var total=cart.reduce(function(sum,item){return sum+(item.price*item.quantity)},0);
      dataLayer.push({ecommerce:null});
      dataLayer.push({event:'begin_checkout',ecommerce:{currency:'PKR',value:total,items:cart},checkout_action:'buy_now'});
      dataLayer.push({event:'buy_now',buy_now_action:'practice_order',ecommerce:{currency:'PKR',value:total,items:cart}});
      document.getElementById('confirmation').style.display='block';
      localStorage.removeItem('kettleCart');cart=[];renderCart();
    });
    renderCart();
  </script>
</body>
</html>
